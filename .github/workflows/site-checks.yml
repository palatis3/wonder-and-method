name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan real commit identities so reviewed exact false-positive
          # fingerprints stay valid; a shallow root attributes every file to HEAD.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deployment/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install verified Gitleaks for handoff checks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          chmod +x "$scanner_dir/gitleaks"
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan repository for secrets
        run: gitleaks git --redact=100 --no-banner --no-color --ignore-gitleaks-allow
      - run: npm ci
      - run: npm ci --prefix deployment
      - name: Build and verify unit, content, historical-route and Worker checks
        run: npm run ci:core
      - name: Partition and validate the complete browser inventory
        run: npm run ci:browser -- plan
      - name: Share the exact verified build and partition plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build-${{ github.run_attempt }}
          path: |
            dist/
            evidence/build.json
            evidence/site-quality.json
            output/ci/core/
            output/ci/plan.json
            output/ci/shard-*.txt
            output/seo/
            output/site-contract/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - name: Use the signed Ubuntu archive for browser dependencies
        run: bash scripts/ci-ubuntu-archive.sh
      - run: npx playwright install --with-deps chromium
      - name: Execute the assigned tests with complete result accounting
        run: npm run ci:browser -- shard ${{ matrix.shard }}
      - name: Retain shard results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: output/ci/shard-${{ matrix.shard }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  seo-editorial:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - run: npm run ci:gate -- seo-editorial
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-seo-editorial-${{ github.run_attempt }}
          path: output/ci/gates/seo-editorial/
          if-no-files-found: error
          retention-days: 14
  reading-accessibility:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - name: Use the signed Ubuntu archive for browser dependencies
        run: bash scripts/ci-ubuntu-archive.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:gate -- reading-accessibility
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-reading-accessibility-${{ github.run_attempt }}
          path: output/ci/gates/reading-accessibility/
          if-no-files-found: error
          retention-days: 14
      - name: Retain reading-accessibility screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reading-accessibility-results
          path: output/reading/
          if-no-files-found: error
          retention-days: 14
  verify:
    if: always()
    needs: [core, browser, seo-editorial, reading-accessibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reject failed, skipped or cancelled prerequisites
        env:
          WM_CI_NEEDS: '${{ toJSON(needs) }}'
        run: node --input-type=module -e "import {requirePrerequisites} from './scripts/ci-contract.mjs'; requirePrerequisites(JSON.parse(process.env.WM_CI_NEEDS), ['core','browser','seo-editorial','reading-accessibility']);"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: browser-shard-*-${{ github.run_attempt }}
          path: output/ci/shards/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gate-seo-editorial-${{ github.run_attempt }}
          path: output/ci/gates/seo-editorial/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gate-reading-accessibility-${{ github.run_attempt }}
          path: output/ci/gates/reading-accessibility/
      - name: Verify every test and mint the complete technical manifest
        env:
          WM_CI_NEEDS: '${{ toJSON(needs) }}'
        run: npm run ci:browser -- aggregate
      - name: Retain combined browser checks and release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-journeys
          path: |
            output/playwright/
            output/site-contract/
            evidence/technical-check.json
            evidence/site-quality.json
            output/seo/
            output/ci/plan.json
          if-no-files-found: error
          retention-days: 14
  standards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compare every emitted file across two clean builds
        run: npm run check:reproducible
      - name: Validate every generated HTML document with Nu
        run: npm run check:html
      - name: Retain build comparison and HTML diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standards-reports
          path: output/ci/
          if-no-files-found: error
          retention-days: 14
  cross-browser:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use the signed Ubuntu archive for browser dependencies
        run: bash scripts/ci-ubuntu-archive.sh
      - run: npx playwright install --with-deps firefox webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - name: Verify Firefox and WebKit buying, form, navigation and footer journeys
        run: npm run test:cross-browser
      - name: Retain cross-browser results and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cross-browser-journeys
          path: output/cross-browser/
          if-no-files-found: error
          retention-days: 14
  performance:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use the signed Ubuntu archive for browser dependencies
        run: bash scripts/ci-ubuntu-archive.sh
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - name: Measure three cold mobile Lighthouse runs per representative page
        run: npm run check:performance
      - name: Retain measured metrics and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: performance-reports
          path: output/ci/performance/
          if-no-files-found: error
          retention-days: 14
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deployment/package-lock.json
      - run: npm ci
      - run: npm ci --prefix deployment
      - name: Audit site tooling and deployment dependencies
        run: npm run check:dependencies
      - name: Retain all vulnerability findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-reports
          path: output/ci/dependencies/
          if-no-files-found: error
          retention-days: 14
  links:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - name: Check all rendered source and outbound links, including redirect chains
        run: npm run check:links
      - name: Retain every link, affected page and redirect hop
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: outbound-links
          path: output/ci/links/
          if-no-files-found: error
          retention-days: 30
  visual:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use the signed Ubuntu archive for browser dependencies
        run: bash scripts/ci-ubuntu-archive.sh
      - name: Install pinned Chromium and matching fonts
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.run_attempt }}
      - run: npm run ci:browser -- verify-build
      - name: Compare reviewed desktop and phone screenshots
        run: npm run test:visual
      - name: Retain expected, actual and difference images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: visual-comparison
          path: output/visual/
          if-no-files-found: error
          retention-days: 14
