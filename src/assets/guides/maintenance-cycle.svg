<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660" role="img" aria-labelledby="title desc"><title id="title">A useful care cycle</title><desc id="desc">Identify: Name the important visitor task. → Check: Follow the complete path. → Record: Passed, failed or unverified? → Correct: Agree a bounded change. → Retest: Confirm the changed behavior.</desc><rect width="360" height="660" fill="#f5f1e8"/><text x="20" y="29" fill="#365c52" font-family="Arial,sans-serif" font-size="10" font-weight="700"><tspan x="20" dy="0">WONDER &amp; METHOD / FIELD GUIDE</tspan></text><text x="20" y="65" fill="#172b35" font-family="Arial,sans-serif" font-size="25" font-weight="700"><tspan x="20" dy="0">A useful care cycle</tspan></text><rect x="20" y="95" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="121" r="12" fill="#1c5148"/><text x="39" y="126" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">1</tspan></text><text x="65" y="127" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Identify</tspan></text><text x="34" y="156" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Name the important visitor task.</tspan></text><path d="M180 177v18m-5-5 5 5 5-5" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="196" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="222" r="12" fill="#1c5148"/><text x="39" y="227" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">2</tspan></text><text x="65" y="228" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Check</tspan></text><text x="34" y="257" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Follow the complete path.</tspan></text><path d="M180 278v18m-5-5 5 5 5-5" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="297" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="323" r="12" fill="#1c5148"/><text x="39" y="328" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">3</tspan></text><text x="65" y="329" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Record</tspan></text><text x="34" y="358" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Passed, failed or unverified?</tspan></text><path d="M180 379v18m-5-5 5 5 5-5" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="398" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="424" r="12" fill="#1c5148"/><text x="39" y="429" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">4</tspan></text><text x="65" y="430" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Correct</tspan></text><text x="34" y="459" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Agree a bounded change.</tspan></text><path d="M180 480v18m-5-5 5 5 5-5" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="499" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="525" r="12" fill="#1c5148"/><text x="39" y="530" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">5</tspan></text><text x="65" y="531" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Retest</tspan></text><text x="34" y="560" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Confirm the changed behavior.</tspan></text><text x="20" y="630" fill="#365c52" font-family="Arial,sans-serif" font-size="15" font-weight="700"><tspan x="20" dy="0">Repeat at the agreed interval.</tspan></text></svg>