<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900"><rect width="360" height="900" fill="#f5f1e8"/><text x="20" y="30" fill="#365c52" font-family="Arial, sans-serif" font-size="10" font-weight="700"><tspan x="20" dy="0">WONDER &amp; METHOD / FIELD GUIDE</tspan></text><text x="20" y="65" fill="#172b35" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="20" dy="0">Trace one inquiry.</tspan><tspan x="20" dy="35">Find the missing step.</tspan></text><text x="20" y="119" fill="#172b35" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="20" dy="0">Use fictional content and a test inbox.</tspan></text><rect x="20" y="142" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="170" r="12" fill="#1c5148"/><text x="40" y="175" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">1</tspan></text><text x="65" y="176" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Page submission</tspan></text><text x="35" y="205" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Can the visitor complete it?</tspan><tspan x="35" dy="22.4">Record the result and time.</tspan></text><path d="M180 242v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="268" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="296" r="12" fill="#1c5148"/><text x="40" y="301" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">2</tspan></text><text x="65" y="302" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Saved record (if kept)</tspan></text><text x="35" y="331" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Look for your labeled test.</tspan><tspan x="35" dy="22.4">Some forms do not save it.</tspan></text><path d="M180 368v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="394" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="422" r="12" fill="#1c5148"/><text x="40" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">3</tspan></text><text x="65" y="428" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Email notification</tspan></text><text x="35" y="457" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Check the form’s recipient</tspan><tspan x="35" dy="22.4">and email-delivery status.</tspan></text><path d="M180 494v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="520" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="548" r="12" fill="#1c5148"/><text x="40" y="553" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">4</tspan></text><text x="65" y="554" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Inbox delivery</tspan></text><text x="35" y="583" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Find the same test message.</tspan><tspan x="35" dy="22.4">Check spam and quarantine.</tspan></text><path d="M180 620v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="646" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="674" r="12" fill="#1c5148"/><text x="40" y="679" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">5</tspan></text><text x="65" y="680" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Reply and follow-up</tspan></text><text x="35" y="709" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Reply to the controlled address.</tspan><tspan x="35" dy="22.4">Confirm the reply arrived.</tspan></text><text x="20" y="779" fill="#365c52" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="20" dy="0">Find the first missing step.</tspan><tspan x="20" dy="19.599999999999998">Retest after the agreed change.</tspan></text></svg>