<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
  <title id="title">Care and search work meet at verification</title>
  <desc id="desc">Two lanes. Care keeps the site working with approved hours, links and forms. Search work improves the search decision with clearer page purpose and service copy. Both lead to verifying and recording the change. This is a process diagram, not a growth forecast.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4556db"/></marker></defs>
  <rect width="360" height="520" rx="12" fill="#f8f7f2"/>
  <g font-family="Arial, sans-serif" fill="#0e1b2a" text-anchor="middle">
    <text x="180" y="42" font-size="26" font-weight="700">Two kinds of work</text>
    <rect x="10" y="76" width="162" height="240" rx="10" fill="#e4ebe2" stroke="#b9c5b5"/>
    <rect x="188" y="76" width="162" height="240" rx="10" fill="#eceefa" stroke="#c0c6ee"/>
    <text x="91" y="114" font-size="20" font-weight="700"><tspan x="91">Keep the site</tspan><tspan x="91" dy="27">working</tspan></text>
    <text x="269" y="114" font-size="20" font-weight="700"><tspan x="269">Improve the</tspan><tspan x="269" dy="27">search decision</tspan></text>
    <path d="M32 166H150M210 166H328" stroke="#a6afbb"/>
    <text x="91" y="211" font-size="20"><tspan x="91">Approved</tspan><tspan x="91" dy="29">hours, links</tspan><tspan x="91" dy="29">and forms</tspan></text>
    <text x="269" y="211" font-size="20"><tspan x="269">Clearer page</tspan><tspan x="269" dy="29">purpose and</tspan><tspan x="269" dy="29">service copy</tspan></text>
    <path d="M91 320V347H269V320M180 347V375" fill="none" stroke="#4556db" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="30" y="384" width="300" height="102" rx="10" fill="#0e1b2a"/>
    <text x="180" y="425" font-size="23" font-weight="700" fill="#fff"><tspan x="180">Verify and record</tspan><tspan x="180" dy="31">the change</tspan></text>
  </g>
</svg>
