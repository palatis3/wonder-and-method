<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660" role="img" aria-labelledby="title desc"><title id="title">From service to inquiry</title><desc id="desc">Service: Which jobs do you accept? → Evidence: Show approved project facts. → Coverage: Where does the service apply? → Inquiry: Ask for useful project details. → Acknowledge: Explain the actual next step.</desc><rect width="360" height="660" fill="#f5f1e8"/><text x="20" y="29" fill="#365c52" font-family="Arial,sans-serif" font-size="10" font-weight="700"><tspan x="20" dy="0">WONDER &amp; METHOD / FIELD GUIDE</tspan></text><text x="20" y="65" fill="#172b35" font-family="Arial,sans-serif" font-size="25" font-weight="700"><tspan x="20" dy="0">From service to inquiry</tspan></text><rect x="20" y="95" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="121" r="12" fill="#1c5148"/><text x="39" y="126" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">1</tspan></text><text x="65" y="127" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Service</tspan></text><text x="34" y="156" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Which jobs do you accept?</tspan></text><path d="M180 177v18m-5-5 5 5 5-5" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="196" width="320" height="82" rx="10" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="43" cy="222" r="12" fill="#1c5148"/><text x="39" y="227" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700"><tspan x="39" dy="0">2</tspan></text><text x="65" y="228" fill="#172b35" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="65" dy="0">Evidence</tspan></text><text x="34" y="257" fill="#172b35" font-family="Arial,sans-serif" font-size="15" font-weight="400"><tspan x="34" dy="0">Show approved project facts.</tspan><