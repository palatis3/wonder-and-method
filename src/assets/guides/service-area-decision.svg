<svg xmlns="http://www.w3.org/2000/svg" width="360" height="860" viewBox="0 0 360 860"><rect width="360" height="860" fill="#f5f1e8"/><text x="20" y="30" fill="#365c52" font-family="Arial, sans-serif" font-size="10" font-weight="700"><tspan x="20" dy="0">WONDER &amp; METHOD / FIELD GUIDE</tspan></text><text x="20" y="65" fill="#172b35" font-family="Arial, sans-serif" font-size="25" font-weight="700"><tspan x="20" dy="0">Does this area need</tspan><tspan x="20" dy="35">a separate page?</tspan></text><text x="20" y="119" fill="#172b35" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="20" dy="0">Begin with the customer decision.</tspan></text><rect x="20" y="142" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="170" r="12" fill="#1c5148"/><text x="40" y="175" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">1</tspan></text><text x="65" y="176" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Real coverage</tspan></text><text x="35" y="205" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Confirm the actual service</tspan><tspan x="35" dy="22.4">and delivery boundaries.</tspan></text><path d="M180 242v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="268" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="296" r="12" fill="#1c5148"/><text x="40" y="301" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">2</tspan></text><text x="65" y="302" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Visitor need</tspan></text><text x="35" y="331" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">What does this visitor need</tspan><tspan x="35" dy="22.4">to understand or do?</tspan></text><path d="M180 368v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="394" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="422" r="12" fill="#1c5148"/><text x="40" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">3</tspan></text><text x="65" y="428" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Substantial added help</tspan></text><text x="35" y="457" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Add useful advice or evidence.</tspan><tspan x="35" dy="22.4">A new place name is not enough.</tspan></text><path d="M180 494v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="520" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="548" r="12" fill="#1c5148"/><text x="40" y="553" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">4</tspan></text><text x="65" y="554" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Choose the page</tspan></text><text x="35" y="583" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Use an existing page if it fits.</tspan><tspan x="35" dy="22.4">Separate only for added help.</tspan></text><path d="M180 620v22m-6-6 6 6 6-6" fill="none" stroke="#60736e" stroke-width="2"/><rect x="20" y="646" width="320" height="100" rx="12" fill="#fffdf8" stroke="#b9c5bb"/><circle cx="44" cy="674" r="12" fill="#1c5148"/><text x="40" y="679" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="40" dy="0">5</tspan></text><text x="65" y="680" fill="#172b35" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="65" dy="0">Maintain accuracy</tspan></text><text x="35" y="709" fill="#172b35" font-family="Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Name the owner and review</tspan><tspan x="35" dy="22.4">coverage when it changes.</tspan></text><text x="20" y="779" fill="#365c52" font-family="Arial, sans-serif" font-size="14" font-weight="700"><tspan x="20" dy="0">Service reach does not mean an office.</tspan><tspan x="20" dy="19.599999999999998">One useful coverage page may suffice.</tspan></text></svg>