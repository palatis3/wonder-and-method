<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660" role="img" aria-labelledby="title desc">
  <title id="title">From an audit question to a dated change record</title>
  <desc id="desc">Question leads to evidence. If enough evidence is available, choose a priority, agree a bounded fix, retest and keep a dated record. If a check needs access, record the gap and obtain authorized access before returning to that evidence check.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4556db"/></marker></defs>
  <rect width="360" height="660" rx="12" fill="#f8f7f2"/>
  <g fill="none" stroke="#4556db" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M180 76V104"/><path d="M180 168V181H94V198"/><path d="M180 181H267V198"/>
    <path d="M94 279V297H180V316"/><path d="M180 380V406"/><path d="M180 470V496"/><path d="M180 560V586"/>
    <path d="M345 240H354V136H333"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0e1b2a" text-anchor="middle">
    <rect x="30" y="12" width="300" height="64" rx="9" fill="#e4ebe2"/><text x="180" y="53" font-size="24" font-weight="700">1. Question</text>
    <rect x="30" y="104" width="300" height="64" rx="9" fill="#e4ebe2"/><text x="180" y="145" font-size="24" font-weight="700">2. Evidence</text>
    <rect x="15" y="201" width="158" height="78" rx="9" fill="#eceefa"/><text x="94" y="231" font-size="20"><tspan x="94">Enough</tspan><tspan x="94" dy="27">evidence</tspan></text>
    <rect x="189" y="201" width="156" height="78" rx="9" fill="#f3e8d4"/><text x="267" y="230" font-size="20"><tspan x="267">Needs access?</tspan><tspan x="267" dy="27">Record gap</tspan></text>
    <rect x="30" y="316" width="300" height="64" rx="9" fill="#e4ebe2"/><text x="180" y="357" font-size="24" font-weight="700">3. Priority</text>
    <rect x="30" y="406" width="300" height="64" rx="9" fill="#e4ebe2"/><text x="180" y="447" font-size="24" font-weight="700">4. Bounded fix</text>
    <rect x="30" y="496" width="300" height="64" rx="9" fill="#e4ebe2"/><text x="180" y="537" font-size="24" font-weight="700">5. Retest</text>
    <rect x="30" y="586" width="300" height="64" rx="9" fill="#0e1b2a"/><text x="180" y="627" font-size="24" font-weight="700" fill="#fff">6. Dated record</text>
  </g>
</svg>
